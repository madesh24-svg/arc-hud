name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key
        env:
          KEY_B64: ${{ secrets.ARCHUD_KEYSTORE_B64 }}
        run: echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/archud.p12"
      - name: Build release APK
        env:
          ARCHUD_KEYSTORE: ${{ runner.temp }}/archud.p12
          ARCHUD_KEYSTORE_PASSWORD: ${{ secrets.ARCHUD_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: |
          cp app/build/outputs/apk/release/app-release.apk arc-hud.apk
          cp link/build/outputs/apk/release/link-release.apk arc-link.apk
      # Manufacturer table (MAC prefix -> vendor) from Wireshark's public OUI list, published with the
      # release so devices download it from this repo only. Optional: the release still ships without it.
      - name: Build manufacturer table
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 https://www.wireshark.org/download/automated/data/manuf -o manuf.txt
          python3 .github/scripts/build_oui.py manuf.txt oui.tsv.gz
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ARC HUD 1.0.${{ github.run_number }}
          files: |
            arc-hud.apk
            arc-link.apk
            oui.tsv.gz
          make_latest: true
